name: Sync sing-box rules

on:
  schedule:
    - cron: "0 */12 * * *"   # every 12 hours
  workflow_dispatch: {}       # manual trigger

permissions:
  contents: write

concurrency:
  group: sync-sing-box-rules
  cancel-in-progress: false

env:
  UPSTREAM_OWNER: SukkaLab          # keep in sync with config/sync.json
  UPSTREAM_REPO: ruleset.skk.moe    # keep in sync with config/sync.json
  UPSTREAM_BRANCH: master           # keep in sync with config/sync.json
  UPSTREAM_PATH: sing-box           # keep in sync with config/sync.json

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout this repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Sparse-checkout upstream sing-box directory
        run: |
          git clone --depth 1 --filter=blob:none --sparse \
            --branch "$UPSTREAM_BRANCH" \
            "https://github.com/$UPSTREAM_OWNER/$UPSTREAM_REPO.git" upstream_repo
          cd upstream_repo
          git sparse-checkout set "$UPSTREAM_PATH"
          mkdir -p "$GITHUB_WORKSPACE/upstream"
          cp -r "$UPSTREAM_PATH" "$GITHUB_WORKSPACE/upstream/sing-box"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install sing-box CLI (for SRS compilation)
        run: |
          SING_BOX_VERSION=$(curl -fsSL https://api.github.com/repos/SagerNet/sing-box/releases/latest \
            | grep -m1 '"tag_name"' | sed -E 's/.*"v([^"]+)".*/\1/')
          echo "Installing sing-box v${SING_BOX_VERSION}"
          curl -fsSL -o sing-box.tar.gz \
            "https://github.com/SagerNet/sing-box/releases/download/v${SING_BOX_VERSION}/sing-box-${SING_BOX_VERSION}-linux-amd64.tar.gz"
          tar -xzf sing-box.tar.gz
          sudo mv "sing-box-${SING_BOX_VERSION}-linux-amd64/sing-box" /usr/local/bin/sing-box
          rm -rf sing-box.tar.gz "sing-box-${SING_BOX_VERSION}-linux-amd64"
          sing-box version

      - name: Run cleanup + SRS compile on the checked-out files
        id: sync
        run: python3 scripts/sync_and_clean.py

      - name: Commit changes
        if: steps.sync.outputs.changed == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add sing-box SRS CHANGELOG.md logs access-links.txt
          git commit -m "chore(sync): ${{ steps.sync.outputs.tag }}"
          git push

      - name: Tag release
        if: steps.sync.outputs.changed == 'true'
        run: |
          git tag ${{ steps.sync.outputs.tag }}
          git push origin ${{ steps.sync.outputs.tag }}

      - name: Create GitHub release
        if: steps.sync.outputs.changed == 'true'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "${{ steps.sync.outputs.tag }}" \
            --title "${{ steps.sync.outputs.tag }}" \
            --notes-file "${{ steps.sync.outputs.summary_path }}" \
            "${{ steps.sync.outputs.links_path }}"

      - name: No changes
        if: steps.sync.outputs.changed != 'true'
        run: echo "No rule changes detected upstream — skipping commit/tag/release."