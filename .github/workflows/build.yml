name: Sync sing-box/mihomo rules

on:
  schedule:
    - cron: "0 */12 * * *"   # every 12 hours
  workflow_dispatch: {}       # manual trigger

permissions:
  contents: write

concurrency:
  group: sync-sing-box-rules
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout this repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Sparse-checkout every configured source
        run: |
          mkdir -p "$GITHUB_WORKSPACE/@rules"
          jq -c '.sources[]' sync.json | while read -r src; do
            owner=$(echo "$src" | jq -r '.owner')
            repo=$(echo "$src" | jq -r '.repo')
            branch=$(echo "$src" | jq -r '.branch')
            upstream_path=$(echo "$src" | jq -r '.upstream_path')
            directory_name=$(echo "$src" | jq -r '.directory_name // (.upstream_path | split("/") | last)')

            namespace="@${owner}/${repo}/${branch}/${directory_name}"
            echo "== Fetching ${namespace}  <-  ${owner}/${repo}@${branch}:${upstream_path} =="
            rm -rf tmp_clone
            git clone --depth 1 --filter=blob:none --sparse \
              --branch "$branch" \
              "https://github.com/$owner/$repo.git" tmp_clone
            (cd tmp_clone && git sparse-checkout set "$upstream_path")

            dest="$GITHUB_WORKSPACE/@rules/${namespace}"
            mkdir -p "$dest"
            cp -r "tmp_clone/$upstream_path/." "$dest/"
            rm -rf tmp_clone
          done

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install sing-box CLI (for SRS compilation)
        run: |
          SING_BOX_VERSION=$(curl -fsSL https://api.github.com/repos/SagerNet/sing-box/releases/latest \
            | grep -m1 '"tag_name"' | sed -E 's/.*"v([^"]+)".*/\1/')
          echo "Installing sing-box v${SING_BOX_VERSION}"
          curl -fsSL -o sing-box.tar.gz \
            "https://github.com/SagerNet/sing-box/releases/download/v${SING_BOX_VERSION}/sing-box-${SING_BOX_VERSION}-linux-amd64.tar.gz"
          tar -xzf sing-box.tar.gz
          sudo mv "sing-box-${SING_BOX_VERSION}-linux-amd64/sing-box" /usr/local/bin/sing-box
          rm -rf sing-box.tar.gz "sing-box-${SING_BOX_VERSION}-linux-amd64"
          sing-box version

      - name: Install mihomo CLI (for MRS compilation)
        run: |
          MIHOMO_VERSION=$(curl -fsSL https://api.github.com/repos/MetaCubeX/mihomo/releases/latest \
            | grep -m1 '"tag_name"' | sed -E 's/.*"v([^"]+)".*/\1/')
          echo "Installing mihomo v${MIHOMO_VERSION}"
          curl -fsSL -o mihomo.gz \
            "https://github.com/MetaCubeX/mihomo/releases/download/v${MIHOMO_VERSION}/mihomo-linux-amd64-v${MIHOMO_VERSION}.gz"
          gunzip mihomo.gz
          chmod +x mihomo
          sudo mv mihomo /usr/local/bin/mihomo
          rm -f mihomo.gz
          mihomo -v

      - name: Run cleanup + SRS/MRS compile on the checked-out files
        id: sync
        run: python3 sync_and_clean.py

      - name: Commit documentation to main branch
        if: steps.sync.outputs.changed == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add README.md CHANGELOG.md
          if [ -n "$(git status --porcelain README.md CHANGELOG.md)" ]; then
            git commit -m "docs(sync): update README.md and CHANGELOG.md [${{ steps.sync.outputs.tag }}]"
            git push origin main
          fi

      - name: Commit changes to release branch
        if: steps.sync.outputs.changed == 'true'
        run: |
          mkdir -p /tmp/build_out
          [ -d json ] && cp -r json /tmp/build_out/
          [ -d conf ] && cp -r conf /tmp/build_out/
          [ -d srs ] && cp -r srs /tmp/build_out/
          [ -d mrs ] && cp -r mrs /tmp/build_out/
          [ -d logs ] && cp -r logs /tmp/build_out/
          [ -f README.md ] && cp README.md /tmp/build_out/
          # Copy the summary file (relative path from sync outputs) to /tmp for use after branch switch
          summary_src="${{ steps.sync.outputs.summary_path }}"
          [ -f "$summary_src" ] && cp "$summary_src" /tmp/build_out/summary.md || true

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git fetch origin release:release || true
          if git rev-parse --verify release >/dev/null 2>&1; then
            git checkout release
          else
            git checkout --orphan release
            git rm -rf . 2>/dev/null || true
          fi

          [ -d /tmp/build_out/json ] && rm -rf json && cp -r /tmp/build_out/json .
          [ -d /tmp/build_out/conf ] && rm -rf conf && cp -r /tmp/build_out/conf .
          [ -d /tmp/build_out/srs ] && rm -rf srs && cp -r /tmp/build_out/srs .
          [ -d /tmp/build_out/mrs ] && rm -rf mrs && cp -r /tmp/build_out/mrs .
          [ -d /tmp/build_out/logs ] && rm -rf logs && cp -r /tmp/build_out/logs .

          git rm -rf README.md ACCESS_LINKS.md CHANGELOG.md @rules 2>/dev/null || true
          rm -rf README.md ACCESS_LINKS.md CHANGELOG.md @rules

          git add json conf srs mrs logs
          if [ -n "$(git status --porcelain)" ]; then
            git commit -m "chore(sync): ${{ steps.sync.outputs.tag }}"
            git push origin release
          fi

      - name: Tag release
        if: steps.sync.outputs.changed == 'true'
        run: |
          git tag ${{ steps.sync.outputs.tag }}
          git push origin ${{ steps.sync.outputs.tag }}

      - name: Create GitHub release
        if: steps.sync.outputs.changed == 'true'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "${{ steps.sync.outputs.tag }}" \
            --title "${{ steps.sync.outputs.tag }}" \
            --notes-file "/tmp/build_out/summary.md" \
            "/tmp/build_out/README.md"

      - name: No changes
        if: steps.sync.outputs.changed != 'true'
        run: echo "No rule changes detected upstream — skipping commit/tag/release."