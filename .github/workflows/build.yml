name: Sync sing-box/mihomo rules

on:
  push:
    paths:
      - 'custom/**'
      - 'sync.json'
      - 'sync_and_clean.py'
      - 'blacklist.json'
      - '.github/workflows/build.yml'
  schedule:
    - cron: "0 */12 * * *"   # every 12 hours
  workflow_dispatch: {}       # manual trigger

# This repo (proxy-rules) is config-only from here on: sync.json,
# blacklist.json, custom/, sync_and_clean.py, this workflow. Nothing this
# workflow does ever writes back to it, so the default GITHUB_TOKEN only
# needs read access for the checkout below. Everything this job generates
# — srs/json/conf/yaml/files/logs/README on one branch, the raw synced
# source tree on another — is pushed to a SEPARATE destination repo
# (DEST_REPO below) instead, which needs its own write-capable token; see
# the "secrets.RULES_REPO_TOKEN" note at the clone step.
permissions:
  contents: read

concurrency:
  group: sync-sing-box-rules
  cancel-in-progress: false

env:
  # Destination repo that receives every generated file. Requires a
  # `RULES_REPO_TOKEN` secret in THIS repo: a PAT (classic, "repo" scope,
  # or fine-grained with contents:write) belonging to an account with push
  # access to DEST_REPO. The default GITHUB_TOKEN cannot be used here —
  # it's scoped to the repo the workflow runs in, not to DEST_REPO.
  DEST_REPO: AnyGong/rules
  # Build output (srs/json/conf/yaml/files/logs/README) — current content
  # only, no dated subdirectories; this branch's own commit history is
  # the changelog.
  DEST_MAIN_BRANCH: main
  # Raw, unmodified upstream source mirror (what used to be @rules/ on
  # the old @sync-rules branch of this repo).
  DEST_SOURCE_BRANCH: source

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout this repo (config only — never written back to)
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Sparse-checkout every configured source
        run: |
          mkdir -p "$GITHUB_WORKSPACE/@rules"
          jq -c '.sources[]' sync.json | while read -r src; do
            owner=$(echo "$src" | jq -r '.owner')
            repo=$(echo "$src" | jq -r '.repo')
            branch=$(echo "$src" | jq -r '.branch')
            upstream_path=$(echo "$src" | jq -r '.upstream_path')
            directory_name=$(echo "$src" | jq -r '.directory_name // (.upstream_path | split("/") | last)')

            # Clone from the source's own "repo_url" when set (GitLab,
            # self-hosted, etc.); otherwise default to GitHub.
            repo_url=$(echo "$src" | jq -r '.repo_url // ""')
            if [ -n "$repo_url" ] && [ "$repo_url" != "null" ]; then
              clone_url="$repo_url"
            else
              clone_url="https://github.com/$owner/$repo.git"
            fi

            namespace="@${owner}/${repo}/${branch}/${directory_name}"
            echo "== Fetching ${namespace}  <-  ${clone_url}@${branch}:${upstream_path} =="
            rm -rf tmp_clone
            git clone --depth 1 --filter=blob:none --sparse \
              --branch "$branch" \
              "$clone_url" tmp_clone
            (cd tmp_clone && git sparse-checkout set "$upstream_path")

            dest="$GITHUB_WORKSPACE/@rules/${namespace}"
            mkdir -p "$dest"
            # Copy via tar so the nested clone's .git metadata is EXCLUDED.
            # Without this, `cp -r tmp_clone/. dest/` drags .git/ into the
            # namespace dir (upstream_path="."), then the sync script copies
            # those .git internals into json/ and files/, and `git add -A`
            # records any directory containing .git as a gitlink (embedded
            # submodule reference) instead of committing the real files —
            # which is exactly what makes GitHub render them as un-openable
            # directories with the files missing.
            (cd "tmp_clone/$upstream_path" && tar cf - --exclude='.git' .) | (cd "$dest" && tar xf -)
            rm -rf tmp_clone
          done

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install sing-box CLI (for SRS compilation)
        run: |
          SING_BOX_VERSION=$(curl -fsSL https://api.github.com/repos/SagerNet/sing-box/releases/latest \
            | grep -m1 '"tag_name"' | sed -E 's/.*"v([^"]+)".*/\1/')
          echo "Installing sing-box v${SING_BOX_VERSION}"
          curl -fsSL -o sing-box.tar.gz \
            "https://github.com/SagerNet/sing-box/releases/download/v${SING_BOX_VERSION}/sing-box-${SING_BOX_VERSION}-linux-amd64.tar.gz"
          tar -xzf sing-box.tar.gz
          sudo mv "sing-box-${SING_BOX_VERSION}-linux-amd64/sing-box" /usr/local/bin/sing-box
          rm -rf sing-box.tar.gz "sing-box-${SING_BOX_VERSION}-linux-amd64"
          sing-box version

      - name: Install mihomo CLI (for MRS compilation)
        run: |
          MIHOMO_VERSION=$(curl -fsSL https://api.github.com/repos/MetaCubeX/mihomo/releases/latest \
            | grep -m1 '"tag_name"' | sed -E 's/.*"v([^"]+)".*/\1/')
          echo "Installing mihomo v${MIHOMO_VERSION}"
          curl -fsSL -o mihomo.gz \
            "https://github.com/MetaCubeX/mihomo/releases/download/v${MIHOMO_VERSION}/mihomo-linux-amd64-v${MIHOMO_VERSION}.gz"
          gunzip mihomo.gz
          chmod +x mihomo
          sudo mv mihomo /usr/local/bin/mihomo
          rm -f mihomo.gz
          mihomo -v

      - name: Run cleanup + SRS/MRS compile on the checked-out files
        id: sync
        run: python3 sync_and_clean.py

      - name: Save build outputs to /tmp/build_out
        if: steps.sync.outputs.changed == 'true'
        run: |
          # sync_and_clean.py only ever writes current content — no dated
          # subdirectories in any of these trees — so this is a flat copy.
          mkdir -p /tmp/build_out
          [ -d json ] && cp -r json /tmp/build_out/
          [ -d conf ] && cp -r conf /tmp/build_out/
          [ -d srs ] && cp -r srs /tmp/build_out/
          [ -d mrs ] && cp -r mrs /tmp/build_out/
          [ -d yaml ] && cp -r yaml /tmp/build_out/
          [ -d files ] && cp -r files /tmp/build_out/
          [ -d logs ] && cp -r logs /tmp/build_out/
          [ -f README.md ] && cp README.md /tmp/build_out/
          summary_src="${{ steps.sync.outputs.summary_path }}"
          [ -f "$summary_src" ] && cp "$summary_src" /tmp/build_out/summary.md || true

      - name: Clone destination rules repo
        if: steps.sync.outputs.changed == 'true'
        env:
          RULES_REPO_TOKEN: ${{ secrets.RULES_REPO_TOKEN }}
        run: |
          set -euo pipefail
          if [ -z "${RULES_REPO_TOKEN}" ]; then
            echo "::error::secrets.RULES_REPO_TOKEN is not set — add a PAT with push access to ${DEST_REPO} under this repo's Settings → Secrets → Actions."
            exit 1
          fi
          git clone "https://x-access-token:${RULES_REPO_TOKEN}@github.com/${DEST_REPO}.git" /tmp/rules_repo
          cd /tmp/rules_repo
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Commit build output to rules repo's main branch
        if: steps.sync.outputs.changed == 'true'
        working-directory: /tmp/rules_repo
        run: |
          set -euo pipefail
          git fetch origin "${DEST_MAIN_BRANCH}:${DEST_MAIN_BRANCH}" || true
          # Full snapshot rebuild every run: wipe both the index AND the
          # working tree before repopulating, so nothing from a previous
          # run (or a previous, differently-shaped commit) can ever
          # partially linger — including, e.g., a directory that used to
          # hold a gitlink. `git clean -fdx` handles untracked leftovers;
          # `git read-tree --empty` + `find … rm -rf` guarantee the index
          # and working tree are both empty even for a branch that already
          # existed and was just checked out.
          git clean -fdx
          if git rev-parse --verify "${DEST_MAIN_BRANCH}" >/dev/null 2>&1; then
            git checkout "${DEST_MAIN_BRANCH}"
          else
            git checkout --orphan "${DEST_MAIN_BRANCH}"
          fi
          git read-tree --empty
          find . -mindepth 1 -maxdepth 1 ! -name '.git' -exec rm -rf {} +

          [ -d /tmp/build_out/json ] && cp -r /tmp/build_out/json .
          [ -d /tmp/build_out/conf ] && cp -r /tmp/build_out/conf .
          [ -d /tmp/build_out/srs ] && cp -r /tmp/build_out/srs .
          [ -d /tmp/build_out/mrs ] && cp -r /tmp/build_out/mrs .
          [ -d /tmp/build_out/yaml ] && cp -r /tmp/build_out/yaml .
          [ -d /tmp/build_out/files ] && cp -r /tmp/build_out/files .
          [ -d /tmp/build_out/logs ] && cp -r /tmp/build_out/logs .
          [ -f /tmp/build_out/README.md ] && cp /tmp/build_out/README.md .
          [ -f /tmp/build_out/summary.md ] && cp /tmp/build_out/summary.md .

          git add -A

          # Regression guard: never silently commit a gitlink (mode
          # 160000) — a directory containing a nested .git, which is
          # exactly what makes GitHub render a folder as grey and
          # un-openable. Fail loudly instead so it gets noticed and fixed.
          bad=$(git ls-files -s | awk '$1=="160000"{print $4}')
          if [ -n "$bad" ]; then
            echo "::error::Refusing to commit — gitlink(s) detected in staged tree: $bad"
            exit 1
          fi

          if [ -n "$(git status --porcelain)" ]; then
            commit_msg="chore: ${{ steps.sync.outputs.tag }}"
            git commit -m "$commit_msg"

            max_attempts=5
            attempt=1
            until git push origin "HEAD:${DEST_MAIN_BRANCH}"; do
              if [ "$attempt" -ge "$max_attempts" ]; then
                echo "::error::Failed to push ${DEST_MAIN_BRANCH} to ${DEST_REPO} after ${max_attempts} attempts."
                exit 1
              fi
              echo "Push rejected (attempt ${attempt}/${max_attempts}) — retrying against the latest remote tip."
              git fetch origin "${DEST_MAIN_BRANCH}"
              # This branch is a fully-regenerated snapshot each run, so
              # there's no meaningful history to rebase commit-by-commit —
              # just re-stage the same rebuilt tree on top of whatever the
              # remote tip now is.
              git reset --soft "origin/${DEST_MAIN_BRANCH}"
              git commit -m "$commit_msg" --allow-empty
              attempt=$((attempt + 1))
              sleep $((RANDOM % 5 + 1))
            done
          fi

      - name: Commit raw source files to rules repo's source branch
        if: steps.sync.outputs.changed == 'true'
        working-directory: /tmp/rules_repo
        run: |
          set -euo pipefail
          mkdir -p /tmp/sync_rules_out
          if [ -d "$GITHUB_WORKSPACE/@rules" ]; then
            cp -r "$GITHUB_WORKSPACE/@rules/." /tmp/sync_rules_out/
          fi

          git fetch origin "${DEST_SOURCE_BRANCH}:${DEST_SOURCE_BRANCH}" || true
          git clean -fdx
          if git rev-parse --verify "${DEST_SOURCE_BRANCH}" >/dev/null 2>&1; then
            git checkout "${DEST_SOURCE_BRANCH}"
          else
            git checkout --orphan "${DEST_SOURCE_BRANCH}"
          fi
          git read-tree --empty
          find . -mindepth 1 -maxdepth 1 ! -name '.git' -exec rm -rf {} +

          if [ -d /tmp/sync_rules_out ]; then
            cp -r /tmp/sync_rules_out/. .
          fi

          git add -A

          bad=$(git ls-files -s | awk '$1=="160000"{print $4}')
          if [ -n "$bad" ]; then
            echo "::error::Refusing to commit — gitlink(s) detected in staged tree: $bad"
            exit 1
          fi

          if [ -n "$(git status --porcelain)" ]; then
            commit_msg="chore: sync raw source [${{ steps.sync.outputs.tag }}]"
            git commit -m "$commit_msg"

            max_attempts=5
            attempt=1
            until git push origin "HEAD:${DEST_SOURCE_BRANCH}"; do
              if [ "$attempt" -ge "$max_attempts" ]; then
                echo "::error::Failed to push ${DEST_SOURCE_BRANCH} to ${DEST_REPO} after ${max_attempts} attempts."
                exit 1
              fi
              echo "Push rejected (attempt ${attempt}/${max_attempts}) — retrying against the latest remote tip."
              git fetch origin "${DEST_SOURCE_BRANCH}"
              git reset --soft "origin/${DEST_SOURCE_BRANCH}"
              git commit -m "$commit_msg" --allow-empty
              attempt=$((attempt + 1))
              sleep $((RANDOM % 5 + 1))
            done
          fi

      - name: Tag and release in rules repo
        if: steps.sync.outputs.changed == 'true'
        env:
          GITHUB_TOKEN: ${{ secrets.RULES_REPO_TOKEN }}
        working-directory: /tmp/rules_repo
        run: |
          set -euo pipefail
          tag="${{ steps.sync.outputs.tag }}"

          if git ls-remote --exit-code --tags origin "refs/tags/${tag}" >/dev/null 2>&1; then
            echo "Tag ${tag} already exists on ${DEST_REPO} — skipping (nothing to do)."
            exit 0
          fi

          git tag "${tag}"

          max_attempts=5
          attempt=1
          until git push origin "${tag}"; do
            if [ "$attempt" -ge "$max_attempts" ]; then
              echo "::error::Failed to push tag ${tag} to ${DEST_REPO} after ${max_attempts} attempts."
              exit 1
            fi
            if git ls-remote --exit-code --tags origin "refs/tags/${tag}" >/dev/null 2>&1; then
              echo "Tag ${tag} appeared on ${DEST_REPO} from another run — treating as success."
              exit 0
            fi
            echo "Push of tag ${tag} rejected (attempt ${attempt}/${max_attempts}) — retrying."
            attempt=$((attempt + 1))
            sleep $((RANDOM % 5 + 1))
          done

          if gh release view "$tag" --repo "${DEST_REPO}" >/dev/null 2>&1; then
            echo "Release ${tag} already exists on ${DEST_REPO} — skipping creation."
          else
            gh release create "$tag" \
              --repo "${DEST_REPO}" \
              --title "$tag" \
              "/tmp/build_out/README.md"
          fi

      - name: No changes
        if: steps.sync.outputs.changed != 'true'
        run: echo "No rule changes detected upstream — skipping commit/tag/release."