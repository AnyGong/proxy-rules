name: Sync sing-box/mihomo rules

on:
  push:
    paths:
      - 'custom/**'
      - 'sync.json'
      - 'sync_and_clean.py'
      - 'blacklist.json'
      - '.github/workflows/build.yml'
  schedule:
    - cron: "0 */12 * * *"   # every 12 hours
  workflow_dispatch:
    inputs:
      verbose:
        description: "Echo per-file conversion/cleaning details to the job log too (summary.md always has the counts either way)"
        type: boolean
        default: false

# This repo (proxy-rules) is config-only from here on: sync.json,
# blacklist.json, custom/, sync_and_clean.py, this workflow. Nothing this
# workflow does ever writes back to it, so the default GITHUB_TOKEN only
# needs read access for the checkout below.
#
# Every generated format now goes to its OWN destination repo, each with a
# single `main` branch holding that format's files at repo ROOT (no nested
# json/, conf/, etc. subfolder inside the destination repo — the format
# name is already the repo name). There is no more raw-source branch and
# no more single combined "rules" repo.
#
# All six destination repos need a `RULES_REPO_TOKEN` secret in THIS repo:
# a PAT (classic, "repo" scope, or fine-grained with contents:write)
# belonging to an account with push access to all of them. The default
# GITHUB_TOKEN cannot be used — it's scoped to the repo the workflow runs
# in, not to any of these.
permissions:
  contents: read

concurrency:
  group: sync-sing-box-rules
  cancel-in-progress: false

env:
  DEST_BRANCH: main
  DEST_REPO_CONF: AnyGong/prox-rules-conf
  DEST_REPO_JSON: AnyGong/prox-rules-json
  DEST_REPO_YAML: AnyGong/prox-rules-yaml
  DEST_REPO_SRS: AnyGong/prox-rules-srs
  DEST_REPO_MRS: AnyGong/prox-rules-mrs
  DEST_REPO_FILES: AnyGong/prox-rules-files

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout this repo (config only — never written back to)
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Sparse-checkout every configured source
        run: |
          set -euo pipefail
          mkdir -p "$GITHUB_WORKSPACE/@rules"
          jq -c '.sources[]' sync.json | while read -r src; do
            owner=$(echo "$src" | jq -r '.owner')
            repo=$(echo "$src" | jq -r '.repo')
            branch=$(echo "$src" | jq -r '.branch')
            upstream_path=$(echo "$src" | jq -r '.upstream_path')
            directory_name=$(echo "$src" | jq -r '.directory_name // (.upstream_path | split("/") | last)')

            # Clone from the source's own "repo_url" when set (GitLab,
            # self-hosted, etc.); otherwise default to GitHub.
            repo_url=$(echo "$src" | jq -r '.repo_url // ""')
            if [ -n "$repo_url" ] && [ "$repo_url" != "null" ]; then
              clone_url="$repo_url"
            else
              clone_url="https://github.com/$owner/$repo.git"
            fi

            namespace="@${owner}/${repo}/${branch}/${directory_name}"
            echo "== Fetching ${namespace}  <-  ${clone_url}@${branch}:${upstream_path} =="
            rm -rf tmp_clone

            if [ "$upstream_path" = "." ]; then
              # Cone-mode sparse-checkout has no valid pattern meaning "the
              # whole repo" — "." isn't a real tracked directory, so
              # `sparse-checkout set .` silently no-ops and leaves the
              # checkout at whatever `git clone --sparse` defaulted to
              # (top-level files only). That's invisible for repos with
              # files at repo root, but for a repo whose entire content
              # lives under a subdirectory (nothing at top level) it
              # produces a checkout with ZERO files — no error, no
              # warning, just an empty directory tree downstream.
              # Skip sparse-checkout entirely in this case and take
              # everything via a normal (still shallow, still
              # blob-filtered) clone instead.
              git clone --depth 1 --filter=blob:none \
                --branch "$branch" \
                "$clone_url" tmp_clone
            else
              git clone --depth 1 --filter=blob:none --sparse \
                --branch "$branch" \
                "$clone_url" tmp_clone
              (cd tmp_clone && git sparse-checkout set "$upstream_path")
            fi

            dest="$GITHUB_WORKSPACE/@rules/${namespace}"
            mkdir -p "$dest"
            # Copy via tar so the nested clone's .git metadata is EXCLUDED.
            # Without this, `cp -r tmp_clone/. dest/` drags .git/ into the
            # namespace dir (upstream_path="."), then the sync script copies
            # those .git internals into json/ and files/, and `git add -A`
            # records any directory containing .git as a gitlink (embedded
            # submodule reference) instead of committing the real files —
            # which is exactly what makes GitHub render them as un-openable
            # directories with the files missing.
            (cd "tmp_clone/$upstream_path" && tar cf - --exclude='.git' .) | (cd "$dest" && tar xf -)
            rm -rf tmp_clone
          done

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install sing-box CLI (for SRS compilation)
        run: |
          SING_BOX_VERSION=$(curl -fsSL https://api.github.com/repos/SagerNet/sing-box/releases/latest \
            | grep -m1 '"tag_name"' | sed -E 's/.*"v([^"]+)".*/\1/')
          echo "Installing sing-box v${SING_BOX_VERSION}"
          curl -fsSL -o sing-box.tar.gz \
            "https://github.com/SagerNet/sing-box/releases/download/v${SING_BOX_VERSION}/sing-box-${SING_BOX_VERSION}-linux-amd64.tar.gz"
          tar -xzf sing-box.tar.gz
          sudo mv "sing-box-${SING_BOX_VERSION}-linux-amd64/sing-box" /usr/local/bin/sing-box
          rm -rf sing-box.tar.gz "sing-box-${SING_BOX_VERSION}-linux-amd64"
          sing-box version

      - name: Install mihomo CLI (for MRS compilation)
        run: |
          MIHOMO_VERSION=$(curl -fsSL https://api.github.com/repos/MetaCubeX/mihomo/releases/latest \
            | grep -m1 '"tag_name"' | sed -E 's/.*"v([^"]+)".*/\1/')
          echo "Installing mihomo v${MIHOMO_VERSION}"
          curl -fsSL -o mihomo.gz \
            "https://github.com/MetaCubeX/mihomo/releases/download/v${MIHOMO_VERSION}/mihomo-linux-amd64-v${MIHOMO_VERSION}.gz"
          gunzip mihomo.gz
          chmod +x mihomo
          sudo mv mihomo /usr/local/bin/mihomo
          rm -f mihomo.gz
          mihomo -v

      - name: Run cleanup + SRS/MRS compile on the checked-out files
        id: sync
        env:
          SYNC_VERBOSE: ${{ (github.event_name == 'workflow_dispatch' && inputs.verbose) && '1' || '0' }}
        run: python3 sync_and_clean.py

      - name: Save build outputs to /tmp/build_out
        if: steps.sync.outputs.changed == 'true'
        run: |
          # sync_and_clean.py only ever writes current content — no dated
          # subdirectories in any of these trees — so this is a flat copy.
          mkdir -p /tmp/build_out
          [ -d json ] && cp -r json /tmp/build_out/
          [ -d conf ] && cp -r conf /tmp/build_out/
          [ -d srs ] && cp -r srs /tmp/build_out/
          [ -d mrs ] && cp -r mrs /tmp/build_out/
          [ -d yaml ] && cp -r yaml /tmp/build_out/
          [ -d files ] && cp -r files /tmp/build_out/
          summary_src="${{ steps.sync.outputs.summary_path }}"
          [ -f "$summary_src" ] && cp "$summary_src" /tmp/build_out/summary.md || true

      - name: Publish run summary to the job summary
        if: steps.sync.outputs.changed == 'true'
        run: |
          # logs/ and README.md are no longer pushed anywhere — there's no
          # single combined repo left to hold them. summary.md (counts,
          # per-source breakdown, compile results) is still generated by
          # the script; it's published here as the Actions run's own job
          # summary instead, so it stays visible without needing a
          # destination repo for it.
          if [ -f /tmp/build_out/summary.md ]; then
            cat /tmp/build_out/summary.md >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Push each format to its own repo
        if: steps.sync.outputs.changed == 'true'
        env:
          RULES_REPO_TOKEN: ${{ secrets.RULES_REPO_TOKEN }}
        run: |
          set -uo pipefail   # NOT -e: one format's failure must not stop the rest
          if [ -z "${RULES_REPO_TOKEN}" ]; then
            echo "::error::secrets.RULES_REPO_TOKEN is not set — add a PAT with push access to all six prox-rules-* repos under this repo's Settings → Secrets → Actions."
            exit 1
          fi

          overall_failed=0

          for fmt in conf json yaml srs mrs files; do
            case "$fmt" in
              conf)  dest_repo="$DEST_REPO_CONF" ;;
              json)  dest_repo="$DEST_REPO_JSON" ;;
              yaml)  dest_repo="$DEST_REPO_YAML" ;;
              srs)   dest_repo="$DEST_REPO_SRS" ;;
              mrs)   dest_repo="$DEST_REPO_MRS" ;;
              files) dest_repo="$DEST_REPO_FILES" ;;
            esac

            src_dir="/tmp/build_out/${fmt}"
            if [ ! -d "$src_dir" ]; then
              echo "== No ${fmt}/ output this run — skipping ${dest_repo} =="
              continue
            fi

            echo "== Pushing ${fmt}/  ->  ${dest_repo} (branch ${DEST_BRANCH}) =="
            work="/tmp/repo_${fmt}"
            rm -rf "$work"

            (
              set -euo pipefail
              git clone "https://x-access-token:${RULES_REPO_TOKEN}@github.com/${dest_repo}.git" "$work"
              cd "$work"
              git config user.name "github-actions[bot]"
              git config user.email "github-actions[bot]@users.noreply.github.com"

              # Full snapshot rebuild every run: wipe both the index AND
              # the working tree before repopulating, so nothing from a
              # previous, differently-shaped commit can ever partially
              # linger — including, e.g., a directory that used to hold a
              # gitlink. `git clean -fdx` handles untracked leftovers;
              # `git read-tree --empty` + `find … rm -rf` guarantee the
              # index and working tree are both empty even for a branch
              # that already existed and was just checked out by the clone.
              git clean -fdx
              if git rev-parse --verify "${DEST_BRANCH}" >/dev/null 2>&1; then
                git checkout "${DEST_BRANCH}"
              else
                git checkout --orphan "${DEST_BRANCH}"
              fi
              git read-tree --empty
              find . -mindepth 1 -maxdepth 1 ! -name '.git' -exec rm -rf {} +

              # Flat copy: the destination repo's root IS this format's
              # content — no nested conf/json/... subfolder inside it.
              cp -r "$src_dir/." .

              # GitHub rejects any file over 100MB. Rather than let that
              # surface as a confusing rejected push, catch it here with a
              # clear error naming the offending file(s).
              big=$(find . -type f -size +99M ! -path './.git/*' || true)
              if [ -n "$big" ]; then
                echo "::error::Refusing to commit to ${dest_repo} — file(s) over GitHub's 100MB limit:"
                echo "$big"
                exit 1
              fi

              git add -A

              # Regression guard: never silently commit a gitlink (mode
              # 160000) — a directory containing a nested .git, which is
              # exactly what makes GitHub render a folder as grey and
              # un-openable. Fail loudly instead so it gets noticed and fixed.
              bad=$(git ls-files -s | awk '$1=="160000"{print $4}')
              if [ -n "$bad" ]; then
                echo "::error::Refusing to commit to ${dest_repo} — gitlink(s) detected in staged tree: $bad"
                exit 1
              fi

              if [ -n "$(git status --porcelain)" ]; then
                commit_msg="chore: sync ${{ steps.sync.outputs.tag }}"
                # --quiet suppresses the per-file "create mode 100644 ..."
                # diffstat git prints by default — harmless, but on a full
                # snapshot rebuild it's one such line per file, every run.
                git commit --quiet -m "$commit_msg"

                max_attempts=5
                attempt=1
                until git push --quiet origin "HEAD:${DEST_BRANCH}"; do
                  if [ "$attempt" -ge "$max_attempts" ]; then
                    echo "::error::Failed to push ${DEST_BRANCH} to ${dest_repo} after ${max_attempts} attempts."
                    exit 1
                  fi
                  echo "Push rejected (attempt ${attempt}/${max_attempts}) — retrying against the latest remote tip."
                  git fetch origin "${DEST_BRANCH}"
                  # This branch is a fully-regenerated snapshot each run,
                  # so there's no meaningful history to rebase
                  # commit-by-commit — just re-stage the same rebuilt tree
                  # on top of whatever the remote tip now is.
                  git reset --soft "origin/${DEST_BRANCH}"
                  git commit --quiet -m "$commit_msg" --allow-empty
                  attempt=$((attempt + 1))
                  sleep $((RANDOM % 5 + 1))
                done
              else
                echo "No changes for ${dest_repo} — nothing to commit."
              fi
            )
            if [ $? -ne 0 ]; then
              echo "::error::${fmt} -> ${dest_repo} failed — see above."
              overall_failed=1
            fi
          done

          if [ "$overall_failed" -ne 0 ]; then
            exit 1
          fi

      - name: No changes
        if: steps.sync.outputs.changed != 'true'
        run: echo "No rule changes detected upstream — skipping commit."