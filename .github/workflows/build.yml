name: Sync sing-box/mihomo rules


on:
  push:
    paths:
      - 'custom/**'
      - 'sync.json'
      - 'sync_and_clean.json'
      - 'blacklist.json'
      - '.github/workflows/build.yml'
  schedule:
    - cron: "0 */12 * * *"   # every 12 hours
  workflow_dispatch: {}       # manual trigger

permissions:
  contents: write

concurrency:
  group: sync-sing-box-rules
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout this repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Sparse-checkout every configured source
        run: |
          mkdir -p "$GITHUB_WORKSPACE/@rules"
          jq -c '.sources[]' sync.json | while read -r src; do
            owner=$(echo "$src" | jq -r '.owner')
            repo=$(echo "$src" | jq -r '.repo')
            branch=$(echo "$src" | jq -r '.branch')
            upstream_path=$(echo "$src" | jq -r '.upstream_path')
            directory_name=$(echo "$src" | jq -r '.directory_name // (.upstream_path | split("/") | last)')

            namespace="@${owner}/${repo}/${branch}/${directory_name}"
            echo "== Fetching ${namespace}  <-  ${owner}/${repo}@${branch}:${upstream_path} =="
            rm -rf tmp_clone
            git clone --depth 1 --filter=blob:none --sparse \
              --branch "$branch" \
              "https://github.com/$owner/$repo.git" tmp_clone
            (cd tmp_clone && git sparse-checkout set "$upstream_path")

            dest="$GITHUB_WORKSPACE/@rules/${namespace}"
            mkdir -p "$dest"
            cp -r "tmp_clone/$upstream_path/." "$dest/"
            rm -rf tmp_clone
          done

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install sing-box CLI (for SRS compilation)
        run: |
          SING_BOX_VERSION=$(curl -fsSL https://api.github.com/repos/SagerNet/sing-box/releases/latest \
            | grep -m1 '"tag_name"' | sed -E 's/.*"v([^"]+)".*/\1/')
          echo "Installing sing-box v${SING_BOX_VERSION}"
          curl -fsSL -o sing-box.tar.gz \
            "https://github.com/SagerNet/sing-box/releases/download/v${SING_BOX_VERSION}/sing-box-${SING_BOX_VERSION}-linux-amd64.tar.gz"
          tar -xzf sing-box.tar.gz
          sudo mv "sing-box-${SING_BOX_VERSION}-linux-amd64/sing-box" /usr/local/bin/sing-box
          rm -rf sing-box.tar.gz "sing-box-${SING_BOX_VERSION}-linux-amd64"
          sing-box version

      - name: Install mihomo CLI (for MRS compilation)
        run: |
          MIHOMO_VERSION=$(curl -fsSL https://api.github.com/repos/MetaCubeX/mihomo/releases/latest \
            | grep -m1 '"tag_name"' | sed -E 's/.*"v([^"]+)".*/\1/')
          echo "Installing mihomo v${MIHOMO_VERSION}"
          curl -fsSL -o mihomo.gz \
            "https://github.com/MetaCubeX/mihomo/releases/download/v${MIHOMO_VERSION}/mihomo-linux-amd64-v${MIHOMO_VERSION}.gz"
          gunzip mihomo.gz
          chmod +x mihomo
          sudo mv mihomo /usr/local/bin/mihomo
          rm -f mihomo.gz
          mihomo -v

      - name: Run cleanup + SRS/MRS compile on the checked-out files
        id: sync
        run: python3 sync_and_clean.py

      - name: Save build outputs to /tmp/build_out
        if: steps.sync.outputs.changed == 'true'
        run: |
          mkdir -p /tmp/build_out
          [ -d json ] && cp -r json /tmp/build_out/
          [ -d conf ] && cp -r conf /tmp/build_out/
          [ -d srs ] && cp -r srs /tmp/build_out/
          [ -d mrs ] && cp -r mrs /tmp/build_out/
          [ -d yaml ] && cp -r yaml /tmp/build_out/          # ← 新增
          [ -d logs ] && cp -r logs /tmp/build_out/
          [ -f README.md ] && cp README.md /tmp/build_out/
          summary_src="${{ steps.sync.outputs.summary_path }}"
          [ -f "$summary_src" ] && cp "$summary_src" /tmp/build_out/summary.md || true

      - name: Commit documentation to main branch
        if: steps.sync.outputs.changed == 'true'
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add README.md
          if [ -n "$(git status --porcelain README.md)" ]; then
            git commit -m "docs(sync): update README.md [${{ steps.sync.outputs.tag }}]"

            # main can move between this job's initial checkout (potentially
            # minutes ago, before the source clones + tool installs + sync
            # ran) and this push, e.g. another run or a manual commit. A
            # single blind `git push` then fails non-fast-forward. Retry
            # with a fetch+rebase in between instead of failing outright.
            max_attempts=5
            attempt=1
            until git push origin HEAD:main; do
              if [ "$attempt" -ge "$max_attempts" ]; then
                echo "::error::Failed to push README.md to main after ${max_attempts} attempts — remote main keeps moving or a real conflict needs manual resolution."
                exit 1
              fi
              echo "Push to main rejected (attempt ${attempt}/${max_attempts}) — fetching and rebasing before retry."
              git fetch origin main
              if ! git rebase origin/main; then
                echo "::error::Rebase onto origin/main hit a real conflict (likely two runs both editing README.md's top) — aborting for manual resolution."
                git rebase --abort
                exit 1
              fi
              attempt=$((attempt + 1))
              sleep $((RANDOM % 5 + 1))
            done
          fi

      - name: Commit raw source rules to @sync-rules branch
        if: steps.sync.outputs.changed == 'true'
        run: |
          set -euo pipefail
          mkdir -p /tmp/sync_rules_out
          if [ -d "@rules" ]; then
            cp -r "@rules/." /tmp/sync_rules_out/
          fi

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git fetch origin "@sync-rules:@sync-rules" || true
          if git rev-parse --verify "@sync-rules" >/dev/null 2>&1; then
            git checkout "@sync-rules"
          else
            git checkout --orphan "@sync-rules"
          fi

          git rm -rf . 2>/dev/null || true
          git clean -fdx

          if [ -d /tmp/sync_rules_out ]; then
            cp -r /tmp/sync_rules_out/. .
          fi

          git add -A
          if [ -n "$(git status --porcelain)" ]; then
            commit_msg="chore(sync-rules): update raw source rules [${{ steps.sync.outputs.tag }}]"
            git commit -m "$commit_msg"

            max_attempts=5
            attempt=1
            until git push origin "HEAD:@sync-rules"; do
              if [ "$attempt" -ge "$max_attempts" ]; then
                echo "::error::Failed to push @sync-rules after ${max_attempts} attempts."
                exit 1
              fi
              echo "Push to @sync-rules rejected (attempt ${attempt}/${max_attempts}) — retrying against the latest remote tip."
              git fetch origin "@sync-rules"
              # This branch is a fully-regenerated snapshot each run (rm -rf
              # + recreate), so there's no meaningful history to rebase
              # commit-by-commit — just re-stage the same rebuilt tree on
              # top of whatever the remote tip now is.
              git reset --soft "origin/@sync-rules"
              git commit -m "$commit_msg" --allow-empty
              attempt=$((attempt + 1))
              sleep $((RANDOM % 5 + 1))
            done
          fi

      - name: Commit changes to dist branch
        if: steps.sync.outputs.changed == 'true'
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git fetch origin dist:dist || true
          if git rev-parse --verify dist >/dev/null 2>&1; then
            git checkout dist
          else
            git checkout --orphan dist
          fi

          git rm -rf . 2>/dev/null || true
          git clean -fdx

          [ -d /tmp/build_out/json ] && cp -r /tmp/build_out/json .
          [ -d /tmp/build_out/conf ] && cp -r /tmp/build_out/conf .
          [ -d /tmp/build_out/srs ] && cp -r /tmp/build_out/srs .
          [ -d /tmp/build_out/mrs ] && cp -r /tmp/build_out/mrs .
          [ -d /tmp/build_out/yaml ] && cp -r /tmp/build_out/yaml .
          [ -d /tmp/build_out/logs ] && cp -r /tmp/build_out/logs .
          git add -A
          if [ -n "$(git status --porcelain)" ]; then
            commit_msg="chore(dist): ${{ steps.sync.outputs.tag }}"
            git commit -m "$commit_msg"

            max_attempts=5
            attempt=1
            until git push origin HEAD:dist; do
              if [ "$attempt" -ge "$max_attempts" ]; then
                echo "::error::Failed to push dist after ${max_attempts} attempts."
                exit 1
              fi
              echo "Push to dist rejected (attempt ${attempt}/${max_attempts}) — retrying against the latest remote tip."
              git fetch origin dist
              # Same reasoning as @sync-rules: dist is a fully-regenerated
              # snapshot, so rebuild the commit on the new tip rather than
              # attempting a content rebase.
              git reset --soft origin/dist
              git commit -m "$commit_msg" --allow-empty
              attempt=$((attempt + 1))
              sleep $((RANDOM % 5 + 1))
            done
          fi

      - name: Tag release
        if: steps.sync.outputs.changed == 'true'
        run: |
          set -euo pipefail
          tag="${{ steps.sync.outputs.tag }}"

          if git ls-remote --exit-code --tags origin "refs/tags/${tag}" >/dev/null 2>&1; then
            echo "Tag ${tag} already exists on origin — skipping (nothing to do)."
            exit 0
          fi

          git tag "${tag}"

          max_attempts=5
          attempt=1
          until git push origin "${tag}"; do
            if [ "$attempt" -ge "$max_attempts" ]; then
              echo "::error::Failed to push tag ${tag} after ${max_attempts} attempts."
              exit 1
            fi
            if git ls-remote --exit-code --tags origin "refs/tags/${tag}" >/dev/null 2>&1; then
              echo "Tag ${tag} appeared on origin from another run — treating as success."
              exit 0
            fi
            echo "Push of tag ${tag} rejected (attempt ${attempt}/${max_attempts}) — retrying."
            attempt=$((attempt + 1))
            sleep $((RANDOM % 5 + 1))
          done

      - name: Create GitHub release
        if: steps.sync.outputs.changed == 'true'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          tag="${{ steps.sync.outputs.tag }}"

          if gh release view "$tag" >/dev/null 2>&1; then
            echo "Release ${tag} already exists — skipping creation."
          else
            gh release create "$tag" \
              --title "$tag" \
              "/tmp/build_out/README.md"
          fi

      - name: No changes
        if: steps.sync.outputs.changed != 'true'
        run: echo "No rule changes detected upstream — skipping commit/tag/release."